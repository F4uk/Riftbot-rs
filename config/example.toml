schema_version = 2

[runtime]
mode = "signal_only"

[[venues]]
id = "entropy"
kind = "hyperliquid_hip3"
enabled = true

[[venues]]
id = "trade_xyz"
kind = "hyperliquid_hip3"
enabled = true

[[venues]]
id = "lighter"
kind = "lighter"
enabled = true

[pair]
id = "sndk_entropy_lighter"
symbol = "SNDK"
venues = ["entropy", "lighter"]
instruments = ["io:SNDK-USD-PERP.HYPERLIQUID", "SNDK-PERP.LIGHTER"]

[market_data]
stale_after_ms = 1500
minimum_depth_notional = "100.00"
execution_buffer_bps = "2.00"

[fair_value]
sample_interval_ms = 1000
window_duration_ms = 3600000
minimum_samples = 300
max_sample_age_ms = 1500

[strategy]
max_target_notional = "500.00"

[[grid.levels]]
deviation_bps = "5.00"
target_fraction = "0.20"

[[grid.levels]]
deviation_bps = "10.00"
target_fraction = "0.40"

[[grid.levels]]
deviation_bps = "15.00"
target_fraction = "0.60"

[[grid.levels]]
deviation_bps = "20.00"
target_fraction = "0.80"

[[grid.levels]]
deviation_bps = "25.00"
target_fraction = "1.00"

[risk]
max_venue_notional = "1000.00"
max_pair_notional = "1500.00"
max_global_delta = "25.00"
max_session_loss = "100.00"

[execution]
max_residual_delta = "10.00"
max_slippage_bps = "5.00"
intent_expiry_ms = 3000

[recording]
directory = "recordings"
channel_capacity = 8192
